server:
  port: 9900
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

file:
  upload:
    path: ./uploads
    allowed-extensions: txt,md

milvus:
  host: localhost
  port: 19530
  username: ""
  password: ""
  database: default
  timeout: 10000

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/super_biz_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: xxx
    driver-class-name: com.mysql.cj.jdbc.Driver
# 统一聊天模型配置。支持 dashscope、deepseek、openai-compatible。
# DeepSeek 示例：AI_MODEL_PROVIDER=deepseek，AI_MODEL_API_KEY=sk-xxx，AI_MODEL_NAME=deepseek-flash
# 其他 OpenAI-compatible 厂商还需要设置 AI_MODEL_BASE_URL。
ai:
  model:
    provider: ${AI_MODEL_PROVIDER:dashscope}
    api-key: ${AI_MODEL_API_KEY:}
    base-url: ${AI_MODEL_BASE_URL:}
    model: ${AI_MODEL_NAME:qwen3.8-flash}
    timeout: ${AI_MODEL_TIMEOUT:180s}

    # Spring AI MCP 客户端配置
    # 如果使用mock数据，请注释这部分内容
#    mcp:
#      client:
#        enabled: true
#        name: tencent-mcp-server
#        version: 1.0.0
#        request-timeout: 60s
#        type: ASYNC
#        sse:
#          connections:
#            tencent-cls:
#              url: https://mcp-api.tencent-cloud.com
#              sse-endpoint: /sse/92XXXXXXXXb4  # 完整的SSE端点路径

# 阿里云 DashScope Embedding API 配置
dashscope:
  api:
    key: ${DASHSCOPE_API_KEY:}  # 仅用于 Embedding
  embedding:
    model: text-embedding-v4  # 阿里云文本向量化模型

# 文档分片配置
document:
  chunk:
    max-size: 800  # 每个分片最大字符数
    overlap: 100   # 分片之间的重叠字符数

# RAG 检索配置；答案生成走 ai.model 的 Responses API。
rag:
  top-k: 3  # 检索返回的最相似文档数量

# Prometheus 配置
prometheus:
  base-url: http://localhost:9090
  timeout: 10  # 超时时间（秒）
  mock-enabled: false  # 是否启用 Mock 模式（用于测试）

# CLS 云日志服务配置
cls:
  mock-enabled: true  # 是否启用 Mock 模式（用于测试，设为 true 返回与告警关联的模拟日志数据）

aiops:
  evaluation:
    dataset-root: ../Cloud-OpsBench/benchmark

tool:
  registry:
    enabled:
      - getCurrentDateTime
      - queryInternalDocs
      - queryPrometheusAlerts
      - getAvailableLogTopics
      - queryLogs
  retry:
    defaults:
      max-attempts: 3
      initial-interval-ms: 500
      multiplier: 2.0
      max-interval-ms: 3000
    policies:
      queryPrometheusAlerts:
        max-attempts: 3
        initial-interval-ms: 500
      queryInternalDocs:
        max-attempts: 2
        initial-interval-ms: 300

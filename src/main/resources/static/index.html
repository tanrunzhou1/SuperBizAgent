<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能OnCall助手</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Markdown 渲染库 -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <!-- 代码高亮库（可选） -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/es/highlight.min.js"></script>
</head>
<body>
    <div class="app-layout">
        <!-- 左侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2 class="sidebar-title">智能OnCall助手</h2>
            </div>
            
            <div class="sidebar-content">
                <button class="new-chat-btn" id="newChatBtn">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    <span>新建对话</span>
                </button>
                
                <div class="chat-history-section">
                    <div class="history-header">
                        <span>近期对话</span>
                    </div>
                    <div class="chat-history-list" id="chatHistoryList">
                        <!-- 历史对话列表将在这里动态生成 -->
                    </div>
                </div>
                
            </div>
        </aside>

        <!-- 主内容区域 -->
        <main class="main-content">
            <div class="top-action-group">
                <button class="ai-ops-top-btn" id="aiOpsSidebarBtn">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>AI Ops</span>
                </button>
                <button class="ai-ops-top-btn secondary-action-btn" id="evaluationsBtn">Evaluations</button>
                <button class="ai-ops-top-btn secondary-action-btn" id="agentConfigBtn">Agent 配置</button>
            </div>
            <div class="chat-container">
                <div class="welcome-greeting" id="welcomeGreeting">
                    <p>你好！我是智能Oncall小助手</p>
                </div>
                <div class="chat-messages" id="chatMessages">
                </div>
                
                <div class="chat-input-container">
                    <div class="input-group-wrapper">
                        <div class="input-wrapper">
                            <input type="text" id="messageInput" placeholder="问问智能OnCall助手" maxlength="1000" class="message-input">
                            <div class="input-bottom-bar">
                                <div class="tools-btn-wrapper">
                                    <button class="tools-btn" id="toolsBtn" title="更多选项">
                                        <svg class="tools-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                            <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
                                            <circle cx="19" cy="12" r="1.5" fill="currentColor"/>
                                            <circle cx="5" cy="12" r="1.5" fill="currentColor"/>
                                        </svg>
                                    </button>
                                    <div class="tools-menu" id="toolsMenu">
                                        <div class="tools-menu-item" id="uploadFileItem">
                                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                            </svg>
                                            <span>上传文件</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="right-actions">
                                    <div class="mode-selector-wrapper">
                                        <button class="mode-selector-btn" id="modeSelectorBtn">
                                            <span id="currentModeText">快速</span>
                                            <svg class="dropdown-arrow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                            </svg>
                                        </button>
                                        <div class="mode-dropdown" id="modeDropdown">
                                            <div class="dropdown-header">选择对话方式</div>
                                            <div class="dropdown-item active" data-mode="quick">
                                                <div class="dropdown-item-main">
                                                    <span>快速</span>
                                                    <span class="badge-new">新</span>
                                                </div>
                                                <div class="dropdown-item-sub">快速对话</div>
                                            </div>
                                            <div class="dropdown-item" data-mode="stream">
                                                <div class="dropdown-item-main">
                                                    <span>流式</span>
                                                </div>
                                                <div class="dropdown-item-sub">流式对话</div>
                                            </div>
                                        </div>
                                    </div>
                                    <button class="send-btn-circle" id="sendButton" title="发送">
                                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                            <path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <input type="file" id="fileInput" accept=".txt,.md,.markdown" style="display: none;">
                </div>
            </div>
        </main>
    </div>

    <div class="feature-modal" id="aiOpsModal" hidden>
        <div class="feature-dialog">
            <div class="feature-dialog-header"><h2>线上 AIOps 排查</h2><button class="icon-close" data-close-modal="aiOpsModal">×</button></div>
            <p>系统每次都会读取当前活跃告警。可选填补充描述。</p>
            <label for="aiOpsPrompt">补充描述（可选）</label>
            <textarea id="aiOpsPrompt" rows="4" placeholder="例如：请重点关注 payment-service 的不可用问题"></textarea>
            <label for="aiOpsMaxSteps">最大工具步骤</label>
            <input id="aiOpsMaxSteps" type="number" min="1" max="100" value="20">
            <div class="feature-dialog-actions"><button class="secondary-btn" data-close-modal="aiOpsModal">取消</button><button class="primary-btn" id="runAiOpsBtn">开始排查</button></div>
        </div>
    </div>

    <div class="feature-modal" id="evaluationModal" hidden>
        <div class="feature-dialog">
            <div class="feature-dialog-header"><h2>Evaluations 单案例测评</h2><button class="icon-close" data-close-modal="evaluationModal">×</button></div>
            <label for="evaluationDataset">数据集</label>
            <input id="evaluationDataset" value="cloud-ops-bench" readonly>
            <label for="evaluationCaseId">Case ID</label>
            <input id="evaluationCaseId" placeholder="例如 trainticket/runtime/61">
            <label for="evaluationMaxSteps">最大工具步骤</label>
            <input id="evaluationMaxSteps" type="number" min="1" max="100" value="20">
            <label for="evaluationProfile">Agent 配置</label>
            <select id="evaluationProfile"><option value="AIOPS_LIVE">当前线上 AIOps 配置（推荐）</option><option value="EVALUATION">独立测评配置</option></select>
            <div class="feature-dialog-actions"><button class="secondary-btn" data-close-modal="evaluationModal">关闭</button><button class="primary-btn" id="runEvaluationBtn">运行测评</button></div>
            <div id="evaluationOutput" class="evaluation-output" hidden></div>
        </div>
    </div>

    <div class="feature-modal" id="agentConfigModal" hidden>
        <div class="feature-dialog wide-dialog">
            <div class="feature-dialog-header"><h2>Agent 配置</h2><button class="icon-close" data-close-modal="agentConfigModal">×</button></div>
            <label for="agentProfileSelect">Agent Profile</label>
            <select id="agentProfileSelect"><option value="CHAT">Chat</option><option value="AIOPS_LIVE">AIOps</option><option value="EVALUATION">Evaluations</option></select>
            <div class="profile-version-label" id="profileVersionLabel"></div>
            <div id="chatPromptField"><label for="chatPrompt">System Prompt</label><textarea id="chatPrompt" rows="9"></textarea></div>
            <div id="aiOpsPromptFields" hidden>
                <label for="aiOpsSystemPrompt">AIOps ReAct Agent 提示词</label>
                <textarea id="aiOpsSystemPrompt" rows="12"></textarea>
            </div>
            <div class="sampling-grid">
                <label>Temperature<input id="profileTemperature" type="number" step="0.05" min="0" max="2"></label>
                <label>Max Tokens<input id="profileMaxTokens" type="number" min="1" max="32768"></label>
                <label>Top P<input id="profileTopP" type="number" step="0.05" min="0.01" max="1"></label>
            </div>
            <div class="feature-dialog-actions"><button class="secondary-btn" id="reloadProfileBtn">重新加载</button><button class="secondary-btn" id="saveProfileBtn">保存</button><button class="primary-btn" id="applyProfileBtn">应用</button></div>
            <div id="profileConfigNotice" class="profile-config-notice"></div>
        </div>
    </div>

    <!-- 加载遮罩层 -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <div class="loading-text">智能运维分析中，请稍候...</div>
            <div class="loading-subtext">后端正在处理，请耐心等待</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>

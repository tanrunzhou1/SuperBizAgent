services:
  super-biz-agent:
    image: super-biz-agent:1.0
    container_name: super-biz-agent
    restart: unless-stopped

    ports:
      - "9900:9900"

    volumes:
      - ./application.yml:/app/config/application.yml:ro
      - ./db:/app/db
      - ./uploads:/app/uploads
      - ./Cloud-OpsBench/benchmark:/app/data/benchmark:ro